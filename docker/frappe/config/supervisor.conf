[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=frappe:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[group:frappe]
programs=backend,socketio,queue-short,scheduler,frontend

[program:backend]
command=/scripts/service/01_backend.sh
user=frappe
directory=/home/frappe/frappe-bench
priority=10
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:socketio]
command=/scripts/service/02_socketio.sh
user=frappe
directory=/home/frappe/frappe-bench
